login:
  username: "argo"
  password: "argo123"
  email: "argo@recar.com"
  phone: "18888888888"
  timeout: 5 # 登录交互阶段超时时间(秒)
browser:
  unheadless: false # 开启则界面
  trace: false # 有界面时显示点击了哪些
  tab_count: 10 # 最多开启多个tab页面
  proxy: ""
  tab_soft_timeout: 60 # Tab 软超时时间（默认 60s，用于心跳）
  tab_timeout: 240 # Tab 硬超时时间（默认 240s 兜底）
  browser_timeout: 18000 # 浏览器运行最长时间
  max_depth: 10 # 爬行最大深度
  queue_size: 100000 # URL 队列最大容量
  schedule_interval: 0 # 调度间隔(ms)，0 表示不限速
  max_retries: 2 # Tab 超时重试次数
  disable_leakless: false # 遇到安全软件误报时再手动关闭 leakless
auto:
  slow: 1000 # 默认延迟（ms）
  slow_min: 600 # 随机最小延迟（ms）
  slow_max: 1400 # 随机最大延迟（ms）
  filter: ["lougout", "登出", "reset"] # 包含这种字符的就不进行触发事件
  action_limit: 200 # 单页自动动作上限
  batch_size: 20 # 每批执行的最大动作数
  command_timeout_ms: 800 # 等待 go 端下一步指令的超时时间(ms)
  interactions:
    - login
    - playback
    - auto
  middlewares:
    - static
    - interaction
    - metrics
result:
  format: "txt,json"
  outputdir: ""
  name: ""
  mq:
    type: ""
    address: ""
    queue: ""
